name: Test and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks; publishing has its own queue below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: samuelnygaard/mailbridge

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/test_release.cjs
      - run: pip install -r tests/requirements.txt
      - run: python tests/test_bridge.py
      - run: python tests/test_routes.py
      - run: python tests/test_routes.py --auto
      - run: python tests/test_auto_mailboxes.py
      - run: python tests/test_reliability.py
      - run: python tests/test_reconcile.py
      - run: python tests/test_workers.py
      - run: sh -n entrypoint.sh

  container:
    name: Container smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Build the native test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mailbridge:test
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - run: docker run --rm --entrypoint python -v "$PWD:/workspace:ro" -w /workspace mailbridge:test tests/test_entrypoint.py
      - run: python tests/test_container.py --image mailbridge:test

  publish:
    needs: [test, container]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # All release refs share one allocator; explicit version tags cannot race it.
    concurrency:
      group: dockerhub-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets. The token needs write access to samuelnygaard/mailbridge."
            exit 1
          fi
      - name: Select or reuse the release version
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { prepareRelease } = require('./.github/scripts/release.cjs');
            const result = await prepareRelease({ github, context, image: process.env.IMAGE_NAME });
            for (const [name, value] of Object.entries(result)) core.setOutput(name, value);
            core.info(result.publish === 'true'
              ? `Publishing ${result.tag}`
              : 'Skipping a completed release or an older main commit.');

      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.digest == ''
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.publish == 'true'

      - uses: docker/login-action@v3
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.digest == ''
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: image
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.digest == ''
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-arm64
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Promote an existing release image to latest
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Record the successful image as a GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest || steps.image.outputs.digest }}
        with:
          script: |
            const { completeRelease } = require('./.github/scripts/release.cjs');
            await completeRelease({ github, context, image: process.env.IMAGE_NAME,
              version: process.env.RELEASE_VERSION, digest: process.env.IMAGE_DIGEST });
