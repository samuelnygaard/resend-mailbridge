[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:dovecot]
; Dovecot's master process needs root to bind the port and drop privileges.
command=%(ENV_DOVECOT_BIN)s -F
autostart=true
autorestart=true
startretries=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webhook]
command=%(ENV_UVICORN_BIN)s main:app --host 0.0.0.0 --port %(ENV_MAILBRIDGE_HTTP_PORT)s --no-access-log
directory=/app
user=mailbridge
autostart=true
autorestart=true
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
